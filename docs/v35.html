let slide=0;const revealedSlides=new Set();
function render(){const current=slides[slide];const awaitingReveal=current.reveal&&!revealedSlides.has(slide);document.querySelector('main').classList.toggle('demo-slide',current.kind==='demo');document.querySelector('main').classList.toggle('opening-slide',current.kind==='opening');document.querySelector('main').classList.toggle('visual-slide',current.kind==='visual');document.querySelector('main').classList.toggle('architecture-slide',current.kind==='architecture');document.querySelector('main').classList.toggle('text-slide',current.kind==='text');document.querySelector('main').classList.toggle('gallery-slide',current.kind==='gallery');document.getElementById('title').textContent=current.title;const list=document.getElementById('bullets');list.replaceChildren();list.style.visibility=awaitingReveal?'hidden':'';for(const text of current.bullets){const li=document.createElement('li');li.textContent=text;list.append(li)}document.getElementById('visual').innerHTML=current.visual;document.getElementById('caption').innerHTML=current.caption;document.getElementById('status').textContent=(slide+1)+' / '+slides.length;const prev=document.getElementById('prev');const next=document.getElementById('next');prev.disabled=slide===0&&awaitingReveal;prev.textContent=current.reveal&&revealedSlides.has(slide)?'← Hide points':'← Previous';prev.setAttribute('aria-label',current.reveal&&revealedSlides.has(slide)?'Hide points for '+current.title:'Previous slide');next.disabled=slide===slides.length-1;next.textContent=awaitingReveal?'Show points →':'Next →';next.setAttribute('aria-label',awaitingReveal?'Show all points for '+current.title:'Next slide');window.scrollTo(0,0)}
function move(direction){const current=slides[slide];if(current.reveal&&direction>0&&!revealedSlides.has(slide)){revealedSlides.add(slide)}else if(current.reveal&&direction<0&&revealedSlides.has(slide)){revealedSlides.delete(slide)}else{slide=Math.max(0,Math.min(slides.length-1,slide+direction))}render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,a'))return;if(event.target.closest('button')&&[' ','Enter'].includes(event.key))return;if(['ArrowRight','PageDown',' ','Enter'].includes(event.key)){event.preventDefault();move(1)}else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();move(-1)}});

document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;document.getElementById('full').textContent=active?'Exit fullscreen':'Fullscreen';if(active&&document.querySelector('nav').contains(document.activeElement))document.activeElement.blur()});
document.addEventListener('click',event=>{if(!document.fullscreenElement||event.defaultPrevented||event.button!==0||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||event.target.closest('a,button,input,textarea,select,nav')||window.getSelection()?.toString())return;move(1)});
let cursorIdleTimer;
function showCursor(){clearTimeout(cursorIdleTimer);document.documentElement.classList.remove('cursor-idle');if(document.fullscreenElement)cursorIdleTimer=setTimeout(()=>{if(document.fullscreenElement)document.documentElement.classList.add('cursor-idle')},2000)}
document.addEventListener('pointermove',showCursor,{passive:true});
document.addEventListener('pointerdown',showCursor,{passive:true});
document.addEventListener('fullscreenchange',showCursor);
